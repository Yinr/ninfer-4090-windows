name: Build NInfer (Ternary Bonsai, sm_89 / RTX 4070)

# 目标：在 GitHub Actions Windows runner 上，用 TiptopFunk 的 v1.0.8 Windows 端口
# (commit 6eb70a07，即 ada 补丁文档指定的基座) + ninfer-ada-ternary 的补丁集，
# 编译出 sm_89 的三元 Bonsai 推理引擎二进制，并把 FFmpeg DLL + MSVC CRT 一并打包。
#
# ⚠️ 不需要 CUDA 运行时 DLL：CUDA 是**静态链接**进 exe 的（实测 PE 导入表无 cudart64_*.dll，
#    GPU 侧走驱动 nvcuda.dll）。所以制品只要机器有 NVIDIA 驱动 + VC++ 运行时即可。
#    另外 CUDA 13.x 已把 64 位 DLL 从 bin\ 挪到 bin\x64\ —— 别再用 "$CUDA_PATH/bin"/*64_13*.dll 通配。
#
# 为什么走 Actions：本地机器缺 MSVC / CUDA 13 工具链、C 盘满、非管理员。
# Actions Windows runner 自带 MSVC2022 + CMake + Ninja + 管理员权限，CUDA 用 action 现装。
#
# 关键坑（已踩）：
#  1) Jimver/cuda-toolkit 的版本白名单随 action 版本更新；13.3.1 只在 >= v0.2.36 里才有，
#     用 v0.2.16 会报 "Version not available: 13.3.1"。故必须用 v0.2.36。
#  2) MSVC 分支下 CMake 直接引用源码树内 ${PROJECT_SOURCE_DIR}/ffmpeg/{include,lib}，
#     且 ninfer.exe -> ninfer_engine -> ninfer_media_decode -> PkgConfig::FFMPEG 会真正链接
#     avcodec/avformat/avutil/swscale/swresample 的导入库。因此 ffmpeg 开发包
#     (头文件 + *.lib 导入库 + DLL) 必须在 cmake configure 之前放到 engine/ffmpeg。
#     BtbN 的 win64-gpl-shared 包里 lib/ 同时含 MinGW .dll.a 与 MSVC *.lib，可直接用。
#  3) third_party (spdlog/utf8proc/nlohmann/cpp-httplib) 为仓库内联，无 submodule，--depth 1 够用。
#  4) 引擎不需 cuDNN（CMake 无 cudnn 引用），CUDA toolkit 自身即够。
#  5) 【上游文件需自行补工具链修正】作者 patches/README-改动说明.md 明确 `changed-files/` 只快照
#     「三元相关改动」，且 docs/04 §1.8 只提到「三个编译错误」而从未列出 ⇒ 这类修正未随包发布。
#     实测：上游 src/ops/gdn_gating_proj/bf16/bf16_gdn_gating_proj_kernels.cu:365 无捕获 lambda
#     里 std::min(..., kTunedResidentCtasPerSm) 绑定 constexpr 局部变量 => odr-use
#     => 报 C3493，必须显式 `[kTunedResidentCtasPerSm]` 捕获。本仓库 patches/ 已带修好的版本。
#     ⚠️ 别归因于 MSVC 版本：runner 实际就是作者同款 MSVC 14.51.36231（VS18 Enterprise），已否证。
#     注：src/ops/linear{,_swiglu}/nvfp4/*_w4a4_tma.cu 有同型写法，但 CMake 中它们被
#     `if(CMAKE_CUDA_ARCHITECTURES MATCHES "^120")` 门控，sm_89 构建根本不编译，无需改。
#  6) 仓库 CMake 已自带 /utf-8 与 -Xcompiler=/utf-8（CMakeLists.txt:44/47/50），
#     故 VSLANG=1033 + /utf-8 这套中文编码坑已闭合；三元补丁源内也无非 ASCII 字面量。

on:
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [ ternary-ci ]

env:
  VSLANG: "1033"            # MSVC 英文诊断，便于读错误

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout CI 仓库 (workflow + patches)
        uses: actions/checkout@v4

      - name: 克隆引擎基座 (TiptopFunk = Ambolio v1.0.8 @ 6eb70a07)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/TiptopFunk/ninfer-4090-windows.git engine
          cd engine
          git fetch --depth 1 origin 6eb70a0784b68c87efcbeb0b08bd2c3a95914492
          git checkout 6eb70a0784b68c87efcbeb0b08bd2c3a95914492

      - name: 应用三元 (ada) 补丁 + 本地 MSVC 兼容修复 — 覆盖 27 个文件 + 新建 src/ops/linear/ternary/
        shell: cmd
        run: xcopy /E /Y patches\changed-files\* engine\

      - name: 内置 FFmpeg 开发包 (MSVC 编译/链接必需；须在 configure 前)
        shell: bash
        run: |
          curl -fL --retry 2 -o ffmpeg.zip \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          unzip -q -o ffmpeg.zip -d ffmpeg_tmp
          mv ffmpeg_tmp/ffmpeg-master-latest-win64-gpl-shared engine/ffmpeg
          echo "--- engine/ffmpeg ---"; ls engine/ffmpeg
          echo "--- MSVC import libs (.lib) ---"; ls engine/ffmpeg/lib/*.lib
          echo "--- headers ---"; ls engine/ffmpeg/include

      - name: 安装 CUDA 13.3 工具链
        uses: Jimver/cuda-toolkit@v0.2.36      # 必须 >= v0.2.36，其白名单才含 13.3.1
        with:
          cuda: '13.3.1'

      - name: 设置 MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake 配置 (sm_89，编译 Apps -> 自动开 media_acquire)
        shell: cmd
        run: |
          cmake -B engine/build -S engine -G Ninja ^
            -DCMAKE_CUDA_ARCHITECTURES=89 ^
            -DNINFER_ENABLE_AVX2=ON ^
            -DNINFER_BUILD_APPS=ON ^
            -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        shell: cmd
        # `-- -k 0` 把 -k 0 透传给 ninja：失败后继续编译其余目标，
        # 一次 run 就能拿到全部编译错误，避免每轮 25 分钟才发现一个错。
        run: cmake --build engine/build --config Release -j 16 -- -k 0

      - name: 收集运行时 (引擎二进制 + FFmpeg DLL + MSVC CRT)
        shell: bash
        run: |
          mkdir -p dist
          cp engine/build/apps/ninfer.exe dist/           2>/dev/null || true
          cp engine/build/apps/ninfer-serve.exe dist/     2>/dev/null || true
          cp engine/build/apps/ninfer-perplexity.exe dist/ 2>/dev/null || true

          # FFmpeg 运行时 DLL（来自内置开发包的 bin/）—— exe 的导入表里真实存在，
          # 必须随包（avcodec-63 / avformat-63 / avutil-61 / swscale-10）。
          cp engine/ffmpeg/bin/*.dll dist/ 2>/dev/null || true

          # MSVC CRT（动态 /MD）—— PE 导入表实际依赖 MSVCP140 / VCRUNTIME140 / VCRUNTIME140_1，
          # 带上可让制品在没装 VC++ Redist 的机器上也能跑。
          CRT=$(ls -d "$VCToolsRedistDir"x64/Microsoft.VC*.CRT 2>/dev/null | head -1)
          echo "CRT=$CRT"
          if [ -n "$CRT" ]; then cp "$CRT"/*.dll dist/ 2>/dev/null || true; fi

          # ⚠️ CUDA 运行时 DLL：**不需要**。
          #    引擎只链 `cudart.lib` 且是【静态】链接 —— 实测 PE 导入表里只有
          #    d3d12/dxgi/av*/KERNEL32/MSVCP140/VCRUNTIME140/api-ms-win-crt-*，
          #    没有任何 cudart64_*.dll；GPU 侧走 nvcuda.dll（驱动自带）。
          #    另注：即便要拷，CUDA **13.x 已把 64 位 DLL 从 bin\ 移到 bin\x64\**，
          #    老的 `"$CUDA_PATH/bin"/*64_13*.dll` 通配会匹配 0 个文件（曾踩）。
          #    下面保留双路径兜底，仅为将来若改成动态链接时仍能工作。
          for d in "$CUDA_PATH/bin" "$CUDA_PATH/bin/x64"; do
            if [ -d "$d" ]; then
              echo "--- scanning $d ---"
              cp "$d"/*64_13*.dll dist/ 2>/dev/null || true
              cp "$d"/cudnn64*.dll  dist/ 2>/dev/null || true
            fi
          done
          echo "--- dist ---"; ls -la dist

      - name: 冒烟测试 (三个 exe 必须都能打印 usage)
        shell: bash
        run: |
          for e in ninfer ninfer-serve ninfer-perplexity; do
            echo "===== $e ====="
            ./dist/$e.exe --help > /tmp/out.txt 2>&1 && echo "OK exit=0" || echo "FAIL exit=$?"
            head -3 /tmp/out.txt
          done

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-ternary-win-sm89
          path: dist/*
