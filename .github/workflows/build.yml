name: Build NInfer (Ternary Bonsai, sm_89 / RTX 4070)

# 目标：在 GitHub Actions Windows runner 上，用 TiptopFunk 的 v1.0.8 Windows 端口
# (commit 6eb70a07，即 ada 补丁文档指定的基座) + ninfer-ada-ternary 的 39 个三元补丁，
# 编译出 sm_89 的三元 Bonsai 推理引擎二进制，并把 CUDA 13.3 运行时 DLL + ffmpeg 一并打包，
# 使最终制品可在【无任何本地 CUDA/MSVC 安装】的 Windows 机器上直接运行。
#
# 为什么走 Actions：本地机器缺 MSVC / CUDA 13 工具链、C 盘满、非管理员。
# Actions Windows runner 自带 MSVC2022 + CMake + Ninja + 管理员权限，CUDA 用 action 现装。
#
# 关键坑（已踩）：
#  1) Jimver/cuda-toolkit 的版本白名单随 action 版本更新；13.3.1 只在 >= v0.2.36 里才有，
#     用 v0.2.16 会报 "Version not available: 13.3.1"。故必须用 v0.2.36。
#  2) MSVC 分支下 CMake 直接引用源码树内 ${PROJECT_SOURCE_DIR}/ffmpeg/{include,lib}，
#     且 ninfer.exe -> ninfer_engine -> ninfer_media_decode -> PkgConfig::FFMPEG 会真正链接
#     avcodec/avformat/avutil/swscale/swresample 的导入库。因此 ffmpeg 开发包
#     (头文件 + *.lib 导入库 + DLL) 必须在 cmake configure 之前放到 engine/ffmpeg。
#     BtbN 的 win64-gpl-shared 包里 lib/ 同时含 MinGW .dll.a 与 MSVC *.lib，可直接用。
#  3) third_party (spdlog/utf8proc/nlohmann/cpp-httplib) 为仓库内联，无 submodule，--depth 1 够用。
#  4) 引擎不需 cuDNN（CMake 无 cudnn 引用），CUDA toolkit 自身即够。

on:
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [ ternary-ci ]

env:
  VSLANG: "1033"            # MSVC 英文诊断，便于读错误

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout CI 仓库 (workflow + patches)
        uses: actions/checkout@v4

      - name: 克隆引擎基座 (TiptopFunk = Ambolio v1.0.8 @ 6eb70a07)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/TiptopFunk/ninfer-4090-windows.git engine
          cd engine
          git fetch --depth 1 origin 6eb70a0784b68c87efcbeb0b08bd2c3a95914492
          git checkout 6eb70a0784b68c87efcbeb0b08bd2c3a95914492

      - name: 应用三元 (ada) 补丁 — 覆盖 26 个文件 + 新建 src/ops/linear/ternary/
        shell: cmd
        run: xcopy /E /Y patches\changed-files\* engine\

      - name: 内置 FFmpeg 开发包 (MSVC 编译/链接必需；须在 configure 前)
        shell: bash
        run: |
          curl -fL --retry 2 -o ffmpeg.zip \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          unzip -q -o ffmpeg.zip -d ffmpeg_tmp
          mv ffmpeg_tmp/ffmpeg-master-latest-win64-gpl-shared engine/ffmpeg
          echo "--- engine/ffmpeg ---"; ls engine/ffmpeg
          echo "--- MSVC import libs (.lib) ---"; ls engine/ffmpeg/lib/*.lib
          echo "--- headers ---"; ls engine/ffmpeg/include

      - name: 安装 CUDA 13.3 工具链
        uses: Jimver/cuda-toolkit@v0.2.36      # 必须 >= v0.2.36，其白名单才含 13.3.1
        with:
          cuda: '13.3.1'

      - name: 设置 MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake 配置 (sm_89，编译 Apps -> 自动开 media_acquire)
        shell: cmd
        run: |
          cmake -B engine/build -S engine -G Ninja ^
            -DCMAKE_CUDA_ARCHITECTURES=89 ^
            -DNINFER_ENABLE_AVX2=ON ^
            -DNINFER_BUILD_APPS=ON ^
            -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        shell: cmd
        run: cmake --build engine/build --config Release -j 16

      - name: 收集运行时 (引擎二进制 + FFmpeg DLL + CUDA 13.3 DLL)
        shell: bash
        run: |
          mkdir -p dist
          cp engine/build/apps/ninfer.exe dist/           2>/dev/null || true
          cp engine/build/apps/ninfer-serve.exe dist/     2>/dev/null || true
          cp engine/build/apps/ninfer-perplexity.exe dist/ 2>/dev/null || true
          # FFmpeg 运行时 DLL（来自内置开发包的 bin/）
          cp engine/ffmpeg/bin/*.dll dist/ 2>/dev/null || true
          # CUDA 13.3 运行时 DLL
          CUDA_BIN=$(ls -d "/c/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v13.3/bin" 2>/dev/null || true)
          echo "CUDA_BIN=$CUDA_BIN"
          if [ -n "$CUDA_BIN" ]; then
            cp "$CUDA_BIN"/*64_13*.dll dist/ 2>/dev/null || true   # cudart/cublas/cublasLt/nvrtc/nvJitLink/nvptxcompiler ...
            cp "$CUDA_BIN"/cudnn64*.dll dist/ 2>/dev/null || true  # 引擎不需要 cudnn，有则带上
          fi
          echo "--- dist ---"; ls -la dist

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-ternary-win-sm89
          path: dist/*
